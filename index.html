<html lang="ja">
<head>

<style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #fdf6e3; margin: 0; padding: 20px; text-align: center; color: #333; }
    h1 { color: #ff6b6b; font-size: 2.5rem; margin-top: 10px; margin-bottom: 5px; }

    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { font-size: 1.2rem; padding: 10px 20px; border-radius: 50px; border: 4px solid #ccc; background-color: white; cursor: pointer; font-family: inherit; font-weight: 800; transition: 0.2s; }
    
    .tab-btn.active.play { border-color: #4dabf7; background-color: #e7f5ff; color: #1864ab; }
    .tab-btn.active.eat { border-color: #ff922b; background-color: #fff4e6; color: #d9480f; }
    .tab-btn.active.lunch { border-color: #b197fc; background-color: #f3d9fa; color: #862e9c; }

    .tab-btn.active.eat_out { border-color: #f06595; background-color: #fff0f6; color: #a61e4d; }
    
    .action-buttons { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .action-btn { font-size: 1.2rem; padding: 10px 20px; border-radius: 20px; border: none; color: white; cursor: pointer; font-family: inherit; font-weight: 800; transition: transform 0.1s, box-shadow 0.2s; }
    .action-btn:active { transform: scale(0.95); }
    
    .slot-btn { background-color: #fcc419; color: #862e9c; }
    .slot-btn:hover { background-color: #fab005; }
    .slot-btn.disabled { background-color: #ccc; color: #999; cursor: not-allowed; transform: none; }

    .filter-btn { background-color: #ff8787; }

    .shuffle-btn { background-color: #4caf50; }

    .location-btn { background-color: #20c997; }

    .action-btn.greyed-out { background-color: #ced4da !important; color: #868e96 !important; box-shadow: none !important; cursor: not-allowed; }

    #location-filter-panel { display: none; background: white; border-radius: 15px; padding: 20px; margin: 0 auto 20px auto; max-width: 800px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left; }
    .filter-group { margin-bottom: 15px; }
    .filter-group-title { font-size: 1.1rem; font-weight: 800; color: #495057; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
    .filter-labels { display: flex; flex-wrap: wrap; gap: 10px; }
    .filter-checkbox { display: inline-flex; align-items: center; gap: 5px; background: #f1f3f5; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: 800; transition: 0.2s; user-select: none; }
    .filter-checkbox:hover { background: #e9ecef; }
    .filter-checkbox input { cursor: pointer; transform: scale(1.2); margin-right: 5px; }
    .filter-checkbox.checked { background: #e6fcf5; color: #0ca678; border: 1px solid #20c997; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 10px; }
    
    .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 15px rgba(0,0,0,0.1); position: relative; transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-5px); }

    .card-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
    .card-category { display: inline-block; background-color: #f1f3f5; color: #495057; font-size: 0.8rem; padding: 3px 10px; border-radius: 10px; font-weight: 800; }
    .card-address { font-size: 0.8rem; color: #868e96; font-weight: 800; }
    
    .heart-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 2rem; color: #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
    .heart-btn.liked { color: #ff6b6b; }

    .card.restricted { opacity: 0.7; cursor: not-allowed; }
    .card.restricted:hover { transform: none; }
    .restricted-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.7); z-index: 5; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(3px); border-radius: 20px; }
    .restricted-icon { font-size: 3rem; color: #adb5bd; margin-bottom: 10px; }
    .restricted-text { font-size: 1.5rem; font-weight: 800; color: #495057; background: white; padding: 5px 20px; border-radius: 20px; border: 3px solid #dee2e6; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: #fff; width: 90%; max-width: 800px; border-radius: 20px; overflow: hidden; position: relative; display: flex; flex-direction: column; max-height: 90vh; z-index: 1010; }
    .close-btn { position: absolute; top: 10px; right: 20px; color: #333; font-size: 3rem; cursor: pointer; font-weight: bold; z-index: 100; background: rgba(255,255,255,0.7); border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; }
    
    .item-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1020; transition: 0.2s; font-weight: bold; }

    .modal-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; background: #eee; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }

    .modal-gallery img { width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; flex-shrink: 0; }
    .modal-info { padding: 20px; text-align: left; overflow-y: auto; }
    .modal-title { font-size: 2rem; font-weight: 800; margin: 0 0 10px 0; color: #ff6b6b; }

    .modal-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; border-top: 2px dashed #eee; padding-top: 15px; }

    .link-btn:hover { opacity: 0.8; }
    .link-map { background-color: #e3f2fd; color: #1976d2; border: 2px solid #bbdefb; }
    .link-img { background-color: #f3e5f5; color: #7b1fa2; border: 2px solid #e1bee7; }

    #slot-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253, 246, 227, 0.95); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
    
    .slot-machine-container { background: #ffe066; padding: 20px; border-radius: 30px; border: 8px solid #f59f00; box-shadow: 0 15px 0 #e67700, 0 25px 20px rgba(0,0,0,0.3); max-width: 900px; width: 95%; text-align: center; position: relative; margin-bottom: 30px; }
    .slot-title { color: #d9480f; font-size: 2.5rem; margin-top: 0; margin-bottom: 15px; text-shadow: 2px 2px 0 white; }
    
    .slot-reels { display: flex; justify-content: center; gap: 15px; background: #343a40; padding: 20px; border-radius: 15px; box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); flex-wrap: wrap; }
    
    .reel-window { width: 250px; height: 200px; background: white; border-radius: 10px; overflow: hidden; position: relative; border: 4px solid #adb5bd; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    @media (max-width: 850px) { .reel-window { width: 100%; height: 120px; } .slot-reels { flex-direction: column; } .card-info { padding: 10px; } .card-title { font-size: 1.1rem; } .card img { height: 120px; } }

    .reel-strip { display: flex; flex-direction: column; width: 100%; transition: none; }
    
    .reel-item { height: 200px; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; background: white; border-bottom: 2px solid #eee; }
    @media (max-width: 850px) { .reel-item { height: 120px; flex-direction: row; gap: 10px; justify-content: flex-start; } }

    .reel-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin-bottom: 5px; }
    @media (max-width: 850px) { .reel-item img { width: 100px; height: 100px; margin-bottom: 0; } }

    .reel-item-title { font-weight: 800; font-size: 1.1rem; color: #333; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .slot-controls { margin-top: 25px; }
    .spin-btn { font-size: 2rem; font-weight: 800; padding: 15px 50px; background: #fa5252; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 0 #c92a2a; transition: 0.1s; font-family: inherit; }
    .spin-btn:active, .spin-btn.pressed { transform: translateY(8px); box-shadow: 0 0 0 #c92a2a; background: #e03131; }
    .spin-btn:disabled { background: #adb5bd; box-shadow: 0 8px 0 #868e96; cursor: not-allowed; }

    .slot-close-btn { margin-top: 20px; font-size: 1.2rem; font-weight: 800; color: #868e96; text-decoration: underline; cursor: pointer; border: none; background: none; font-family: inherit; }
    .slot-close-btn:hover { color: #495057; }
    
    .reel-window.winner { border-color: #fcc419; box-shadow: 0 0 20px #fcc419, inset 0 0 10px #fcc419; animation: pulse 1s infinite alternate; cursor: pointer; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

    #loading { font-size: 1.5rem; color: #666; margin-top: 50px; font-weight: bold; }
    .version-display { position: fixed; bottom: 10px; right: 15px; color: #aaa; font-size: 0.9rem; font-family: monospace; }
</style>
</head>
<body>

    <h1>✨ どこにいく？ なにたべる？ ✨</h1>
    <div class="age-badge">👦 いま <span id="display-age"></span> さい！</div>

    <div class="tabs">
        <button class="tab-btn active play" onclick="changeTab('play')">🎡 あそぶ</button>
        <button class="tab-btn eat" onclick="changeTab('eat')">🍔 たべる</button>
        <button class="tab-btn lunch" onclick="changeTab('lunch')">🍱 昼食</button> 
        <button class="tab-btn go_out" onclick="changeTab('go_out')">🚗 お出かけ</button>
        <button class="tab-btn eat_out" onclick="changeTab('eat_out')">🍽️ 外食</button>
    </div>

    <div class="action-buttons">
        <button id="slotBtn" class="action-btn slot-btn" onclick="openSlotMachine()">
            <i class="fa-solid fa-gift"></i> 今日の3つ！
        </button>
        <button id="locationBtn" class="action-btn location-btn" onclick="toggleLocationPanel()">
            <i class="fa-solid fa-map-location-dot"></i> ばしょでしぼる
        </button>
        <button id="filterBtn" class="action-btn filter-btn" onclick="toggleFilter()">
            <i class="fa-solid fa-heart"></i> お気に入りだけ
        </button>
        <button class="action-btn shuffle-btn" onclick="shuffleCards()">
            <i class="fa-solid fa-shuffle"></i> シャッフル！
        </button>
    </div>

    <div id="location-filter-panel"></div>
    <div id="loading">データを よみこんでいます...</div>
    <div class="grid" id="cardGrid"></div>

    <div id="slot-modal">
        <div class="slot-machine-container">
            <h2 class="slot-title">🎰 今日の ピックアップ 🎰</h2>
            <div class="slot-reels">
                <div class="reel-window" id="reel-window-0">
                    <div class="reel-strip" id="reel-0"></div>
                </div>
                <div class="reel-window" id="reel-window-1">
                    <div class="reel-strip" id="reel-1"></div>
                </div>
                <div class="reel-window" id="reel-window-2">
                    <div class="reel-strip" id="reel-2"></div>
                </div>
            </div>
            <div class="slot-controls">
                <button class="spin-btn" id="spinBtn" onclick="startSlotSpin()">スタート！</button>
            </div>
        </div>
        <button class="slot-close-btn" onclick="closeSlotMachine()">もどる</button>
    </div>

    <div id="modal" data-current-id="">
        <button class="item-nav-btn item-prev" onclick="prevModal(event)">＜＜</button>
        <button class="item-nav-btn item-next" onclick="nextModal(event)">＞＞</button>

        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <div class="gallery-wrapper">
                <button class="gallery-nav-btn gallery-prev" id="gallery-prev-btn" onclick="scrollGallery(-1, event)">＜</button>
                <button class="gallery-nav-btn gallery-next" id="gallery-next-btn" onclick="scrollGallery(1, event)">＞</button>
                <div class="modal-gallery" id="modal-gallery"></div>
            </div>
            
            <div class="modal-info">
                <span class="card-category" id="modal-category"></span>
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-comment" id="modal-comment"></p>
                <div class="modal-links">
                    <a id="link-map" href="#" target="_blank" class="link-btn link-map"><i class="fa-solid fa-map-location-dot"></i> マップ</a>
                    <a id="link-img" href="#" target="_blank" class="link-btn link-img"><i class="fa-solid fa-images"></i> しゃしん</a>
                    <a id="link-web" href="#" target="_blank" class="link-btn link-web"><i class="fa-solid fa-globe"></i> こうしき</a>
                </div>
            </div>
        </div>
    </div>

    <div class="version-display">v1.14</div>

<script>
    const spreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQERcgQgCQVotbFi5IGy_djP50D3c59AHsR6q5X2PE4Wzpeb8WDwiTvQV3kDF-Z7jFBnBhuxtu9CY7P/pub?output=csv';
    
    const birthYear = 2022;
    const birthMonth = 1;
    const today = new Date();
    let currentAge = today.getFullYear() - birthYear;
    if (today.getMonth() + 1 < birthMonth) {
        currentAge--;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('display-age').innerText = currentAge;
    });

    let data = [];
    let currentDisplayData = []; 
    let currentTab = 'play';
    let showOnlyLiked = false;
    let activeLocationFilters = new Set();

    const regionMap = {
        "ちかくのエリア（市）": ["横浜市", "川崎市", "藤沢市"],
        "北海道・東北": ["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県"],
        "関東": ["茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県"],
        "中部": ["新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県"],
        "近畿": ["三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県"],
        "中国・四国": ["鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県"],
        "九州・沖縄": ["福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"]
    };

    function getRegion(locationStr) {
        for (let r in regionMap) {
            if (regionMap[r].includes(locationStr)) return r;
        }
        return "その他";
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadData() {
        const loadingEl = document.getElementById('loading');
        if (spreadsheetUrl.includes('ここにコピーしたURL')) {
            loadingEl.style.color = 'red';
            loadingEl.innerText = 'エラー: コード内の spreadsheetUrl に設定してください。';
            return;
        }

        Papa.parse(spreadsheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                try {
                    data = results.data.map((item, index) => {
                        const images = item.img ? String(item.img).split(',') : [];
                        const address = item.address ? String(item.address).trim() : '';
                        
                        let locations = [];
                        const prefMatch = address.match(/(.+?[都道府県])/);
                        if (prefMatch) locations.push(prefMatch[1]);
                        
                        const targetCities = ["横浜市", "川崎市", "藤沢市"];
                        targetCities.forEach(city => {
                            if (address.includes(city)) locations.push(city);
                        });

                        return {
                            id: index + 1,
                            type: item.type ? String(item.type).trim() : '',
                            title: item.title ? String(item.title).trim() : '',
                            category: item.category ? String(item.category).trim() : '',
                            comment: item.comment ? String(item.comment).trim() : '',
                            website: item.website ? String(item.website).trim() : '',
                            address: address,
                            map_url: item['マップURL'] || item.map_url || item.mapUrl || '',
                            age_limit: item['対象年齢'] || item.age_limit || item.age || '', 
                            locations: locations,
                            hide: item.hide ? String(item.hide).trim() : '0',
                            images: images,
                            liked: false
                        };
                    });
                    
                    shuffleArray(data);
                    buildLocationFilters();
                    loadingEl.style.display = 'none';
                    renderCards();
                } catch (e) {
                    loadingEl.style.color = 'red';
                    loadingEl.innerText = 'データの処理エラー: ' + e.message;
                }
            }
        });
    }

    function buildLocationFilters() {
        const panel = document.getElementById('location-filter-panel');
        panel.innerHTML = '';
        
        const availableLocs = new Set();
        data.filter(d => d.hide !== '1').forEach(d => {
            d.locations.forEach(loc => availableLocs.add(loc));
        });
        
        if (availableLocs.size === 0) return;

        const grouped = {};
        availableLocs.forEach(loc => {
            const r = getRegion(loc);
            if (!grouped[r]) grouped[r] = [];
            grouped[r].push(loc);
        });

        for (let r in regionMap) {
            if (!grouped[r]) continue;
            
            const groupDiv = document.createElement('div');
            groupDiv.className = 'filter-group';
            groupDiv.innerHTML = `<div class="filter-group-title">${r}</div>`;
            
            const labelsDiv = document.createElement('div');
            labelsDiv.className = 'filter-labels';

            grouped[r].forEach(loc => {
                const label = document.createElement('label');
                label.className = 'filter-checkbox';
                label.innerHTML = `<input type="checkbox" value="${loc}" onchange="updateLocationFilter(this)"> ${loc}`;
                labelsDiv.appendChild(label);
            });
            
            groupDiv.appendChild(labelsDiv);
            panel.appendChild(groupDiv);
        }
    }

    function toggleLocationPanel() {
        const panel = document.getElementById('location-filter-panel');
        const btn = document.getElementById('locationBtn');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            btn.classList.remove('active');
        } else {
            panel.style.display = 'block';
            btn.classList.add('active');
        }
    }

    function updateLocationFilter(checkbox) {
        if (checkbox.checked) {
            activeLocationFilters.add(checkbox.value);
            checkbox.parentElement.classList.add('checked');
        } else {
            activeLocationFilters.delete(checkbox.value);
            checkbox.parentElement.classList.remove('checked');
        }
        renderCards();
    }

    function getAvailableItems() {
        return data.filter(item => {
            if (item.type !== currentTab) return false;
            if (showOnlyLiked && !item.liked) return false;
            if (item.images.length === 0) return false;
            if (item.hide === '1') return false;
            if (activeLocationFilters.size > 0 && !item.locations.some(loc => activeLocationFilters.has(loc))) return false;
            return true;
        });
    }

    function renderCards() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        currentDisplayData = getAvailableItems();
        
        const slotBtn = document.getElementById('slotBtn');
        const validItems = currentDisplayData.filter(item => {
            const minAge = parseInt(item.age_limit, 10);
            return isNaN(minAge) || currentAge >= minAge;
        });
        
        if (validItems.length < 3) {
            slotBtn.classList.add('disabled');
            slotBtn.innerText = '⚠️ 候補が足りません';
        } else {
            slotBtn.classList.remove('disabled');
            slotBtn.innerHTML = '<i class="fa-solid fa-gift"></i> 今日の3つ！';
        }

        currentDisplayData.forEach(item => {
            const minAge = parseInt(item.age_limit, 10);
            const isRestricted = !isNaN(minAge) && currentAge < minAge;

            const card = document.createElement('div');
            card.className = isRestricted ? 'card restricted' : 'card';
            const heartClass = item.liked ? 'fa-solid fa-heart liked' : 'fa-solid fa-heart';
            const thumbImg = item.images[0];

            let overlayHtml = '';
            let clickAction = `onclick="openModal(${item.id})"`;

            if (isRestricted) {
                overlayHtml = `
                    <div class="restricted-overlay">
                        <i class="fa-solid fa-lock restricted-icon"></i>
                        <span class="restricted-text">${minAge} さいから！</span>
                    </div>
                `;
                clickAction = ''; 
            }

            card.innerHTML = `
                <button class="heart-btn ${item.liked ? 'liked' : ''}" onclick="toggleLike(event, ${item.id})">
                    <i class="${heartClass}"></i>
                </button>
                ${overlayHtml}
                <div ${clickAction}>
                    <img src="${thumbImg}" alt="${item.title}">
                    <div class="card-info">
                        <div class="card-meta">
                            ${item.category ? `<span class="card-category">${item.category}</span>` : ''}
                            ${item.address ? `<span class="card-address"><i class="fa-solid fa-location-dot"></i> ${item.address}</span>` : ''}
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function shuffleCards() { shuffleArray(data); renderCards(); }
    
    function changeTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('.tab-btn.' + tab).classList.add('active');
        
        if (document.getElementById('slot-modal').style.display === 'flex') {
            closeSlotMachine();
        }
        renderCards();
    }

    function toggleLike(event, id) {
        event.stopPropagation();
        const item = data.find(d => d.id === id);
        if (item) { item.liked = !item.liked; renderCards(); }
    }

    function toggleFilter() {
        showOnlyLiked = !showOnlyLiked;
        const btn = document.getElementById('filterBtn');
        if (showOnlyLiked) {
            btn.classList.add('filtering');
        } else {
            btn.classList.remove('filtering');
        }
        renderCards();
    }

    let isSpinning = false;
    let slotData = []; 
    const itemHeightDesktop = 200;
    const itemHeightMobile = 120;
    
    function setOtherButtonsGrey(greyOut) {
        const btns = ['locationBtn', 'filterBtn', 'document.querySelector(".shuffle-btn")'];
        document.getElementById('locationBtn').classList.toggle('greyed-out', greyOut);
        document.getElementById('filterBtn').classList.toggle('greyed-out', greyOut);
        document.querySelector('.shuffle-btn').classList.toggle('greyed-out', greyOut);
    }

    function openSlotMachine() {
        const validItems = currentDisplayData.filter(item => {
            const minAge = parseInt(item.age_limit, 10);
            return isNaN(minAge) || currentAge >= minAge;
        });

        if (validItems.length < 3) return; 

        setOtherButtonsGrey(true);
        document.getElementById('slot-modal').style.display = 'flex';
        
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('spinBtn').innerText = 'スタート！';
        document.getElementById('spinBtn').classList.remove('pressed');
        
        for (let i = 0; i < 3; i++) {
            const windowEl = document.getElementById(`reel-window-${i}`);
            windowEl.classList.remove('winner');
            windowEl.onclick = null; 
        }

        setupReels(validItems);
    }

    function closeSlotMachine() {
        if (isSpinning) return; 
        document.getElementById('slot-modal').style.display = 'none';
        setOtherButtonsGrey(false);
    }

    function createReelItemHTML(item) {
        return `
            <div class="reel-item" data-id="${item.id}">
                <img src="${item.images[0]}" alt="${item.title}">
                <div class="reel-item-title">${item.title}</div>
            </div>
        `;
    }

    function setupReels(validItems) {
        slotData = [...validItems];
        shuffleArray(slotData);

        for (let i = 0; i < 3; i++) {
            const strip = document.getElementById(`reel-${i}`);
            strip.style.transition = 'none';
            strip.style.transform = `translateY(0px)`;
            
            let html = '';
            const startItem = slotData[Math.floor(Math.random() * slotData.length)];
            html += createReelItemHTML(startItem);
            strip.innerHTML = html;
        }
    }

    function startSlotSpin() {
        if (isSpinning) return;
        isSpinning = true;
        
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.innerText = 'ちゅうせん中...';
        btn.classList.add('pressed');

        const isMobile = window.innerWidth <= 850;
        const itemHeight = isMobile ? itemHeightMobile : itemHeightDesktop;

        // ★ 1. まず全てのリールの位置とクラスを即座にリセットする
        for (let i = 0; i < 3; i++) {
            const windowEl = document.getElementById(`reel-window-${i}`);
            windowEl.classList.remove('winner');
            windowEl.onclick = null;

            const strip = document.getElementById(`reel-${i}`);
            const lastItem = strip.lastElementChild;
            const currentItemHtml = lastItem ? lastItem.outerHTML : '';
            
            // トランジションを切り、位置を一番上（0px）に戻す
            strip.style.transition = 'none';
            strip.style.transform = `translateY(0px)`;
            strip.innerHTML = currentItemHtml; // 中身を現在の1枚だけにする
        }

        // ★ リフローを強制して、位置0pxをブラウザに確実に確定させる
        void document.body.offsetHeight;

        const shuffled = [...slotData];
        shuffleArray(shuffled);
        const winners = shuffled.slice(0, 3);

        const spinTime = 3000; 
        const delayBetweenReels = 800; 

        // ★ 2. ブラウザが0pxの位置を認識した「次のフレーム」以降に要素を追加
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                for (let i = 0; i < 3; i++) {
                    const strip = document.getElementById(`reel-${i}`);
                    const winner = winners[i];
                    
                    let html = strip.innerHTML; 
                    const spinCycles = 20 + (i * 10); 
                    
                    for (let j = 0; j < spinCycles; j++) {
                        const randomItem = slotData[Math.floor(Math.random() * slotData.length)];
                        html += createReelItemHTML(randomItem);
                    }
                    html += createReelItemHTML(winner);
                    
                    strip.innerHTML = html;

                    // ★ 3. 要素が追加されたら、Y軸の終着点を計算して動かす
                    setTimeout(() => {
                        // 要素数は 1(元) + spinCycles + 1(アタリ) = spinCycles + 2 個。
                        // 最後のアタリの要素のインデックスは (spinCycles + 1) となるのでそこへ移動する
                        const finalPosition = -(spinCycles + 1) * itemHeight; 
                        strip.style.transition = `transform ${spinTime + (i * delayBetweenReels)}ms cubic-bezier(0.1, 0.7, 0.1, 1.15)`;
                        strip.style.transform = `translateY(${finalPosition}px)`;
                    }, 50);

                    setTimeout(() => {
                        const windowEl = document.getElementById(`reel-window-${i}`);
                        windowEl.classList.add('winner');
                        windowEl.onclick = () => { openModal(winner.id); };

                        if (i === 2) {
                            isSpinning = false;
                            btn.innerText = 'もう1回！';
                            btn.disabled = false;
                            btn.classList.remove('pressed');
                        }
                    }, spinTime + (i * delayBetweenReels) + 50);
                }
            });
        });
    }

    function openModal(id) {
        const item = data.find(d => d.id === id);
        if (!item) return;
        
        document.getElementById('modal').setAttribute('data-current-id', id);

        const gallery = document.getElementById('modal-gallery');
        gallery.innerHTML = '';
        item.images.forEach(imgUrl => {
            const img = document.createElement('img');
            img.src = imgUrl.trim();
            gallery.appendChild(img);
        });

        const galleryPrevBtn = document.getElementById('gallery-prev-btn');
        const galleryNextBtn = document.getElementById('gallery-next-btn');
        if (item.images.length > 1) {
            galleryPrevBtn.style.display = 'flex';
            galleryNextBtn.style.display = 'flex';
        } else {
            galleryPrevBtn.style.display = 'none';
            galleryNextBtn.style.display = 'none';
        }

        document.getElementById('modal-title').innerText = item.title;
        document.getElementById('modal-category').innerText = item.category || '';
        document.getElementById('modal-category').style.display = item.category ? 'inline-block' : 'none';
        document.getElementById('modal-comment').innerText = item.comment || '';
        
        if (item.map_url && item.map_url.startsWith('http')) {
            document.getElementById('link-map').href = item.map_url;
        } else {
            document.getElementById('link-map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.title + ' ' + (item.address || ''));
        }

        document.getElementById('link-img').href = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(item.title);
        
        const webBtn = document.getElementById('link-web');
        if (item.website && item.website.startsWith('http')) {
            webBtn.href = item.website;
            webBtn.style.display = 'inline-flex';
        } else {
            webBtn.style.display = 'none';
        }

        document.getElementById('modal').style.display = 'flex';
        gallery.scrollLeft = 0;
    }

    function scrollGallery(direction, event) {
        if (event) event.stopPropagation();
        const gallery = document.getElementById('modal-gallery');
        const scrollAmount = gallery.clientWidth; 
        gallery.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function prevModal(event) {
        if (event) event.stopPropagation();
        if (currentDisplayData.length <= 1) return;
        const currentId = parseInt(document.getElementById('modal').getAttribute('data-current-id'));
        let currentIndex = currentDisplayData.findIndex(d => d.id === currentId);
        
        if(currentIndex === -1) return; 

        do {
            currentIndex = (currentIndex - 1 + currentDisplayData.length) % currentDisplayData.length;
        } while (currentDisplayData[currentIndex].age_limit && currentAge < parseInt(currentDisplayData[currentIndex].age_limit, 10));
        
        openModal(currentDisplayData[currentIndex].id);
    }

    function nextModal(event) {
        if (event) event.stopPropagation();
        if (currentDisplayData.length <= 1) return;
        const currentId = parseInt(document.getElementById('modal').getAttribute('data-current-id'));
        let currentIndex = currentDisplayData.findIndex(d => d.id === currentId);
        
        if(currentIndex === -1) return;

        do {
            currentIndex = (currentIndex + 1) % currentDisplayData.length;
        } while (currentDisplayData[currentIndex].age_limit && currentAge < parseInt(currentDisplayData[currentIndex].age_limit, 10));

        openModal(currentDisplayData[currentIndex].id);
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    window.onload = loadData;
</script>
